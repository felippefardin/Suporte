<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte</title>
</head>
<body>
    <style>
      ::after,
      ::before {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(-120deg,
        #481875, #11031f);
      }
      body, textarea { 
        font-family: sans-serif;
    } 
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
    }
    .form_box {
        display: flex;
        flex-direction: column;
        background-color: #fff;
        border-radius: none;
        width: 700px;
    }
    .form_box .title {
        padding: 24px 32px;
        font-size: 24px;
        border-bottom: thin solid #ccc;
    }
    .form_box form {
        display: flex;
        align-items: start;
        flex-wrap: wrap;
        padding: 35px;
    }
    .form_box input,
    .form_box textarea {
        width: 100%;
        height: 35px;        
        border: thin solid #999;
        padding-left: 18px;
        margin-bottom: 16px;
        font-size: 16px;
    }    
    .form_box input[name=subject] {
        width: 100%;
    }
    .form_box textarea {
        width: 100%;
        height: 180px;
        padding: 16px;
    }
    .form_box button {
        display: block;
        border: none;
        outline: none;
        width: 180px;
        height: 48px;
        border-radius: 8px;
        background-color: #6915b8;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    .form_box button:houver {
        background-color: #000;
    }

    </style>
    
      <div class="container">
        <div class="form_box">

            <h2 class="title">Suporte.</h2>
            <form action="" method="get">
                <input type="text" name="nome" placeholder="Nome">
                <input type="text" name="email" placeholder="E-mail">
                <input type="" name="celular" placeholder="Telefone">
                <input type="tel" name="subject" placeholder="Chamado">

                <textarea name="message" placeholder="Digite sua mensagem"></textarea>
                <button type="submit">Enviar mensagem</button>
            </form>
        </div>
      </div>

</body>
</html>
